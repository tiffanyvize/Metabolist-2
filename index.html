<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolist x TEB Engine | Clinical Bioenergetic Architecture</title>
    <style>
        :root {
            --bg-base: #07090A;
            --bg-card: #0E1215;
            --bg-glass: rgba(14, 18, 21, 0.85);
            --border-glass: rgba(0, 230, 118, 0.15);
            --bio-emerald: #00E676;
            --bio-emerald-glow: rgba(0, 230, 118, 0.2);
            --coral-salmon: #FF6E59;
            --coral-glow: rgba(255, 110, 89, 0.2);
            --text-primary: #F0F4F8;
            --text-secondary: #8A9BA8;
            --accent-gold: #D4AF37;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 230, 118, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 110, 89, 0.03) 0%, transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2.5rem;
            border-bottom: 1px solid var(--border-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--bio-emerald-glow));
        }

        .engine-badge {
            font-size: 0.75rem;
            color: var(--bio-emerald);
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .app-window {
            width: 100%;
            max-width: 820px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 230, 118, 0.05);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .module-section {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .module-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #FFF;
            letter-spacing: -0.01em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--bio-emerald);
            box-shadow: 0 0 12px var(--bio-emerald-glow);
            background: rgba(255, 255, 255, 0.04);
        }

        select option {
            background-color: var(--bg-card);
            color: var(--text-primary);
            padding: 10px;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2.5rem;
            gap: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        button {
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            letter-spacing: 0.03em;
        }

        .btn-primary {
            background: var(--bio-emerald);
            color: var(--bg-base);
            box-shadow: 0 4px 20px var(--bio-emerald-glow);
        }

        .btn-primary:hover {
            background: #00c853;
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(0, 230, 118, 0.35);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1rem;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--bio-emerald);
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .metric-value {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--bio-emerald);
        }

        .metric-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .interactive-panel {
            background: rgba(0, 230, 118, 0.02);
            border: 1px dashed var(--border-glass);
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .interactive-panel:hover {
            background: rgba(0, 230, 118, 0.05);
            border-color: var(--bio-emerald);
        }

        .upload-dropzone {
            width: 100%;
            height: 140px;
            background: rgba(255, 255, 255, 0.01);
            border: 2px dashed rgba(0, 230, 118, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .upload-dropzone:hover {
            background: rgba(0, 230, 118, 0.04);
            border-color: var(--bio-emerald);
        }

        .upload-dropzone img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }

        .log-output {
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--bio-emerald);
            max-height: 180px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .form-row, .metrics-grid {
                grid-template-columns: 1fr;
            }
            .app-window {
                padding: 1.5rem;
            }
        }
    </style>
</head>
